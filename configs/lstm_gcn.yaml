data:
  interim_path: data/interim
  seasons:
  - 2016
  - 2017
  - 2018
  - 2019
  - 2020
  - 2021
  - 2022
  - 2023
  - 2024
experiment:
  description: LSTM con encoder GCN (Improved)
  name: lstm_gcn
model:
  dropout: 0.4
  gnn_hidden: 128
  gnn_out: 128
  gnn_type: gcn
  heads: 8
  hidden_channels: 128
  in_channels: auto
  lstm_hidden: 128
  out_channels: auto
  type: lstm
training:
  batch_size: 1
  device: auto
  epochs: 3000
  log_interval: 10
  lr: 0.0003
  weight_decay: 0.001
  patience: 500
  save_dir: models
  save_name: lstm_gcn.pth
  split_strategy: temporal
