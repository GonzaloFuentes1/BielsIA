data:
  interim_path: data/interim
  seasons:
  - 2020
  - 2021
  - 2022
  - 2023
  - 2024
experiment:
  description: LSTM con encoder Graphormer (Improved)
  name: lstm_graphormer
model:
  dropout: 0.3
  gnn_hidden: 256
  gnn_out: 256
