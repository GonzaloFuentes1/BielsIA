data:
  interim_path: data/interim
  seasons:
  - 2020
  - 2021
  - 2022
  - 2023
  - 2024
experiment:
  description: Transformer con encoder Hybrid GAT-GCN (Improved)
  name: transformer_hybrid_gat_gcn
model:
  dropout: 0.3
  gnn_hidden: 256
